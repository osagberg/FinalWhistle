[package]
name = "fw-match-sim"
description = "Canonical 22-player match simulation. Deterministic, sync, no floats."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints.clippy]
# Canonical-state crate — floats forbidden. The determinism gate
# (`docs/specs/determinism-gate.md` §2 Layer 1) hinges on this.
float_arithmetic = "deny"

[dependencies]
fw-core     = { workspace = true }
fw-content  = { workspace = true }   # T1-2b-iv: SignatureId + SignatureDefinition + SimBiasSnapshot
fixed       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }   # MatchFrameDto JSON (DTO module + dump_frames bin)
rand_chacha = { workspace = true }
# RngCore + SeedableRng traits are accessed via `rand_chacha::rand_core`
# re-export — avoids a direct `rand` dep per Codex P1 self-review finding.
blake3      = { workspace = true }
cordic      = { workspace = true }   # CORDIC trig (acos) for angular penalty in pitch control
thiserror   = { workspace = true }
# clap is only used by the dump_frames binary (src/bin/dump_frames.rs).
# Keeps the dep surface honest: the lib build doesn't pull clap.
clap        = { version = "4", features = ["derive"] }

[dev-dependencies]
insta    = { workspace = true }
proptest = { workspace = true }
ron      = { workspace = true }   # T1-2b-iv: load signature RON fixtures in tests
