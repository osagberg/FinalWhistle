# Determinism gate — explicit required check for merge to main.
#
# This workflow exists separately from ci.yml so the GitHub branch-
# protection "required status checks" list can name the determinism gate
# as a discrete required-passing job. It runs the pinned canonical-hash
# regression in isolation; any platform red is the project stop-sign per
# docs/specs/determinism-gate.md.
#
# Tier-A scope: smoke seed only (60-tick fixture). Phase-4+ full-corpus
# sweep runs in a separate Tier-D manual-dispatch workflow.

name: Determinism Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: determinism-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  canonical-hash:
    name: Canonical hash (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: determinism-${{ matrix.os }}
          # cache-bin: false sidesteps a flaky-restore class — see
          # https://github.com/Swatinem/rust-cache#cache-bin. The ~/.cargo/bin
          # binaries reinstall fast from the toolchain action; caching them
          # here invited a stale `rustup-init` to overshadow `cargo` on a
          # macOS-14 run (89479063). Belt-and-braces.
          cache-bin: false
          cache-on-failure: true

      # P0 backstop (Codex full-project audit, 2026-05-13): the bedrock
      # pinned-hash test `smoke_seed_60_tick_canonical_hash_pinned` MUST
      # NOT be `#[ignore]`d, or `cargo test` returns 0 (ignored tests
      # count as passes) and the entire determinism gate silently bypasses.
      #
      # Primary defense is the in-process meta-test
      # `bedrock_pinned_test_is_not_ignored` (in canonical_hash.rs);
      # commit-time hook (canonical-hash-guard.sh) is the secondary;
      # this CI step is the tertiary belt-and-braces. Uses no
      # GitHub-event inputs, so no injection surface.
      - name: Bedrock-test ignore-attr guard
        shell: bash
        run: |
          set -euo pipefail
          # Invoke a small Python script via a literal-quoted heredoc.
          # No interpolation of any kind; entirely self-contained.
          python3 - <<'PYEOF'
          import re, sys
          path = 'crates/fw-replay/tests/canonical_hash.rs'
          try:
              # Explicit UTF-8 — Python on Windows defaults to cp1252, which
              # chokes on non-ASCII bytes that legitimately live in the
              # canonical_hash.rs comments (rebaseline-history ellipses,
              # arrows, ≥, ×, etc.). Without `encoding='utf-8'` this script
              # passes on macOS/Linux + fails on windows-latest with
              # `UnicodeDecodeError: 'charmap' codec can't decode byte 0x81`.
              src = open(path, encoding='utf-8').read()
          except FileNotFoundError:
              print('::error::expected file ' + path + ' not found')
              sys.exit(1)
          bedrock = 'smoke_seed_60_tick_canonical_hash_pinned'
          fn_match = re.search(r'fn\s+' + re.escape(bedrock), src)
          if not fn_match:
              print('::error file=' + path + '::cannot find fn ' + bedrock)
              sys.exit(1)
          before = src[:fn_match.start()]
          test_idx = before.rfind('#[test]')
          if test_idx == -1:
              print('::error file=' + path + '::no #[test] attribute precedes ' + bedrock)
              sys.exit(1)
          block = before[test_idx:]
          if '#[ignore' in block:
              print('::error file=' + path + ',title=Phase-0 gate disabled::Bedrock pinned-hash test is #[ignore]d. The determinism gate is silently bypassed. Remove #[ignore] from ' + bedrock + '. Re-baseline path: docs/specs/determinism-gate.md section 9.')
              sys.exit(1)
          print('bedrock-ignore-guard: OK (' + bedrock + ' is live)')
          PYEOF

      # The bedrock: run only the canonical_hash integration test in the
      # fw-replay crate. Release mode (see ci.yml for rationale).
      #
      # On hash drift, surface the failure as a GitHub workflow annotation
      # so it shows up on the PR diff at the test-file line, not buried in
      # the run log. The `tee` captures stdout for the annotation step.
      - name: Run canonical-hash regression test
        id: canonical
        shell: bash
        run: |
          set -o pipefail
          cargo test --release -p fw-replay --test canonical_hash 2>&1 | tee canonical-hash-output.txt

      - name: "Annotate failure (drift vs infra)"
        if: failure()
        shell: bash
        run: |
          # Codex audit Nice-to-have #10: prior version annotated every
          # failure as "hash drift" even when cargo couldn't compile
          # (MSRV mismatch on a0b2e08 ancestor). Split here:
          #   - Test ran AND assertion failed -> real hash drift, the
          #     Phase-0 stop-sign.
          #   - cargo couldn't build / test never ran -> infra / build
          #     failure, surface as a separate annotation so the
          #     phase-gate stays clearly attributable.
          if grep -q "smoke_seed_60_tick_canonical_hash_pinned ... FAILED" canonical-hash-output.txt 2>/dev/null; then
            echo "::error file=crates/fw-replay/tests/canonical_hash.rs,title=Canonical hash drift on $MATRIX_OS::Pinned MatchState hash does not agree across platforms. This is the Phase-0 stop-sign per docs/specs/determinism-gate.md. Either revert the offending change OR rebaseline the pinned hash via an authorized SPEC entry."
          else
            echo "::error file=.github/workflows/determinism-gate.yml,title=Determinism gate INFRA failure on $MATRIX_OS::cargo could not compile or test never ran (not hash drift). Inspect the run log for the actual error — likely MSRV / system deps / toolchain mismatch."
          fi
          echo "--- Last 50 lines of test output ---"
          tail -50 canonical-hash-output.txt || true
        env:
          MATRIX_OS: ${{ matrix.os }}

      - name: Upload canonical-hash output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-hash-${{ matrix.os }}
          path: canonical-hash-output.txt
          if-no-files-found: ignore
          retention-days: 14
