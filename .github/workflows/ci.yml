# Per-PR CI — Final Whistle (Rust + Tauri pivot, T0-7)
#
# Three-OS matrix per docs/specs/determinism-gate.md §11: macOS-14
# (Apple Silicon, the dev box), windows-latest, ubuntu-22.04. The pinned
# canonical-state hash must agree across all three. Drift on any single
# platform fails the gate and blocks merge.
#
# Job topology (parallel, fail-fast=false) per the FW v1 audit-03 lesson:
# never let a static-check failure shadow signal from the matrix legs, or
# vice versa. Three independent jobs, each on its own runner pool, so a
# clippy red on Linux does not consume Win/Mac minutes and a Win-only
# determinism red surfaces cleanly side-by-side with a Linux green.
#
# SECURITY: no untrusted input (PR title / body / commit message /
# head_ref / fork-controlled refs) is interpolated into `run:` steps.
# All step commands are static shell invocations.
#
# Reference: https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Reduce noise: Cargo's default progress output is meant for terminals.
  CARGO_INCREMENTAL: 0

jobs:
  # ------------------------------------------------------------------
  # Job 1: cross-platform Rust + frontend matrix. The headline gate.
  # Each leg runs the full lint + test + frontend build pipeline. The
  # `cargo test --workspace` step is where the determinism gate fires
  # (see .github/workflows/determinism-gate.yml for the explicit
  # required-check variant that runs the same test in isolation).
  # ------------------------------------------------------------------
  build-test:
    name: Build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rust toolchain pinned via rust-toolchain.toml at repo root.
      # dtolnay/rust-toolchain reads that file when given "stable", so the
      # version is single-sourced.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Tauri 2 on Linux needs the GTK / WebKit / AppIndicator stack to
      # compile `tauri::generate_context!()` in src-tauri. Codex pre-merge
      # audit flagged this as the second CI blocker on a0b2e08.
      - name: Install Linux Tauri prerequisites
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      # Cargo cache — keyed on Cargo.lock so cache invalidates on dep change.
      # Swatinem/rust-cache handles target/ + ~/.cargo intelligently.
      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
          # cache-bin: false sidesteps a flaky-restore class — see
          # https://github.com/Swatinem/rust-cache#cache-bin. The ~/.cargo/bin
          # binaries reinstall fast from the toolchain action; caching them
          # here invited a stale `rustup-init` to overshadow `cargo` on a
          # macOS-14 run (89479063). Belt-and-braces.
          cache-bin: false
          cache-on-failure: true

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Parity with local `just ci-local` per Codex pre-merge audit Imp #6.
      # The matrix gates should mean what the dev's local pre-commit means.
      - name: banned-terms lint
        run: python3 scripts/lint-banned-terms.py content/ docs/design/ frontend/src/

      # T1-20: regression tests for the lint script — sentinel-scope
      # restriction (must be ignored under content/sources/**, content/baked/**,
      # frontend/src/**, including nested-`docs/`/`scripts/` substrings), and
      # `/content/baked/` coverage (must be scanned, no longer excluded). Adds
      # ~1s of wall-clock; runs on all 3 OSes so cross-OS path-resolution
      # quirks surface here rather than at content-bake time.
      - name: banned-terms lint test suite
        run: python3 scripts/test-lint-banned-terms.py T1_20_LintCoverage T1_20_SentinelScopeRestriction

      - name: determinism-audit
        run: python3 scripts/determinism-audit.py

      # Content-pack validation (FW-VAL). Runs the real validator (Codex
      # full-project audit Tranche 6 + pre-T1-2b re-audit P2): asserts
      # every RoleAffinityTable's weights sum to 10_000 + every key is
      # a real visible attribute, and every PlayerTemplate's attributes
      # are in [0, 1] + ceiling invariants hold. Fail-closed (exits
      # non-zero on any violation).
      #
      # Debug build (no --release). Validate is a static check + small
      # RON walk; release-mode compile of fw-content-baker pushed
      # ubuntu-22.04 over the 20m timeout (run 25810479477). Debug build
      # is plenty fast for a content-load + validation pass.
      - name: content-pack validation (structural only)
        # T1-20: renamed `validate` → `validate-structural` so the CLI surface
        # stops promising "all validators passed" when only structural validators
        # actually run. `validate-semantic` + `validate-content-pack` land at T2-3.
        run: cargo run -p fw-content-baker -- validate-structural

      # The determinism gate fires here. Release mode per spec §11: debug
      # integer-overflow checks can mask hash-affecting bugs by panicking
      # instead of producing a different hash; release lets the hash
      # itself be the contract.
      - name: cargo test --workspace
        run: cargo test --workspace --release

      # Frontend pipeline. Runs on every OS so Win/Mac path-handling bugs
      # surface immediately. pnpm install is cached at the Node setup layer.
      - name: pnpm install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: pnpm typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: pnpm lint
        working-directory: frontend
        run: pnpm lint

      # T1-13: Frontend Vitest suite. The Vitest substrate was activated at
      # T1-6 (1 test file); T1-13 broadened to 3 files (Match + FrameSource
      # + TacticalBoard lifecycle) covering the audit P1 acceptance. Runtime
      # budget ~1s on macOS dev box; matrix legs should comfortably stay
      # under 30s.
      - name: pnpm test
        working-directory: frontend
        run: pnpm test

      - name: pnpm build
        working-directory: frontend
        run: pnpm build

      # Upload diagnostic artifacts on failure: cargo test output (insta
      # snapshots that drifted), frontend build logs, target/ binaries
      # (excluded — too large; the artifacts here are diff/report level).
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-${{ matrix.os }}
          path: |
            target/debug/deps/*.log
            crates/**/tests/snapshots/*.snap.new
            frontend/dist/
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------------------------
  # Job 2 (T1-13): cargo-audit security scan.
  # Runs in parallel with build-test on ubuntu-latest only. Blocks CI
  # on any new RUSTSEC vulnerability advisory. Baseline at T1-13 commit
  # time: 19 transitive unmaintained warnings from Tauri's GTK3 stack
  # (acceptable risk — upstream Tauri owns the fix); zero vulnerabilities.
  # ------------------------------------------------------------------
  cargo-audit:
    name: cargo audit (RUSTSEC vulnerabilities)
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-cargo-audit
          cache-bin: false

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: cargo audit
        run: cargo audit

  # ------------------------------------------------------------------
  # Job 3 (T1-13): cargo-deny license + advisory + bans gate.
  # Per deny.toml at repo root. Permissive + LGPL-compatible license
  # allowlist; advisories deny vulnerabilities + warn on unmaintained
  # (bincode RUSTSEC-2025-0141 explicitly ignored — documented inline
  # in deny.toml). Blocks CI on new viral-license deps or new vulns.
  # ------------------------------------------------------------------
  cargo-deny:
    name: cargo deny (licenses + advisories + bans)
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-deny
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-cargo-deny
          cache-bin: false

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: cargo deny check
        run: cargo deny check
