# Fast PR CI (Tier A) — Final Whistle
#
# Per design/production-pipeline.md + Codex round-4 follow-up plan
# (2026-04-30): three independent jobs, NOT one umbrella, so failures
# in one don't shadow signal from the others. Specifically: a stale
# plugin drop must NOT mask dotnet test determinism failures, and
# Linux-only doc lint must NOT consume Win/Mac matrix minutes.
#
# - Runs on every PR + push to main/develop
# - Static checks on Linux only (~1-2 min)
# - dotnet test runs on Win/Mac/Linux matrix (the determinism gate)
# - Plugin reproducibility runs on Win/Mac/Linux matrix (cross-platform
#   `fw verify-unity-plugins` ensures committed plugin bytes round-trip
#   from a fresh `dotnet publish` on each OS — closes audit-03 P0
#   "cross-platform plugin reproducibility unverified")
# - Budget: ≤5 min static, ≤10 min per matrix leg
# - No Unity Editor boot, no Unity builds (those live in tier-B
#   manual-dispatch)
#
# SECURITY NOTE: this workflow does NOT interpolate any untrusted input
# (github.event.*.title, github.event.*.body, github.head_ref, commit
# messages, etc.) into run: steps. All step commands are static shell
# invocations. See:
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

name: Fast PR CI (Tier A)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel in-progress runs for the same branch when a new push arrives —
# saves Actions minutes on rapid iteration.
concurrency:
  group: fast-pr-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Job 1: static checks. Linux-only, fast. Doc lint, banned-terms,
  # shader-audit. Independent of code/test outcomes — these are pure
  # repo-state checks and don't benefit from Win/Mac matrix minutes.
  # ------------------------------------------------------------------
  static-checks:
    name: Static checks (docs + banned-terms + shader-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        # Required for banned-terms lint.
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: verify-docs (frontmatter + placeholder lint)
        shell: bash
        run: bash ./scripts/fw verify-docs

      - name: banned-terms (Category-A + Category-B vocab lint)
        shell: bash
        run: bash ./scripts/fw banned-terms

      - name: shader-audit (viewer-adapter `_Time` ban per ADR-0008/0009)
        shell: bash
        run: bash ./scripts/fw shader-audit

  # ------------------------------------------------------------------
  # Job 2: MatchSim tests on Win/Mac/Linux matrix. This is the
  # cross-platform deterministic-replay gate — the pinned 60-tick
  # MatchCanonicalState hash MUST match across all three OSes.
  # Independent of plugin-drop state so a stale plugin commit cannot
  # mask test failures (Codex round-4 follow-up requirement).
  # ------------------------------------------------------------------
  matchsim-tests:
    name: MatchSim tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        # Pinned via global.json (latestPatch) — matches the local
        # development SDK exactly so reproducible-build properties
        # behave identically on CI and dev machines.
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: dotnet test
        shell: bash
        run: bash ./scripts/fw test

  # ------------------------------------------------------------------
  # Job 3: plugin reproducibility on Win/Mac/Linux matrix. Each leg
  # publishes MatchSim and byte-diffs against the committed plugin
  # drop in unity-project/Assets/Plugins/MatchSim/. If any OS produces
  # different bytes, the cross-platform deterministic-build claim
  # (SPEC 2026-04-29) is violated. Independent of test results — a
  # determinism-test regression and a plugin-drift regression should
  # fail cleanly side-by-side, not shadow each other.
  # ------------------------------------------------------------------
  plugin-repro:
    name: Plugin reproducibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: verify-unity-plugins (publish + byte-diff committed drop)
        shell: bash
        run: bash ./scripts/fw verify-unity-plugins

  # ------------------------------------------------------------------
  # Phase-gated TODOs — reference shapes only, NOT a backlog.
  # ------------------------------------------------------------------

