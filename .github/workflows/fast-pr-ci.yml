# Fast PR CI (Tier A) — Final Whistle
#
# Per design/production-pipeline.md:
# - Runs on every PR + push to main/develop
# - GitHub-hosted Win/Mac/Linux matrix now active for MatchSim determinism parity
# - Budget: ≤10 minutes per OS leg
# - No Unity Editor boot, no builds
#
# SECURITY NOTE: this workflow does NOT interpolate any untrusted input
# (github.event.*.title, github.event.*.body, github.head_ref, commit
# messages, etc.) into run: steps. All step commands are static shell
# invocations. See:
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
#
# Extension model: Tier-A checks are wired inside `scripts/fw verify`.
# The single job below calls `fw verify`, which currently runs:
#   - verify-docs  (frontmatter + unsubstituted-placeholder check)
#   - banned-terms (Category-A + Category-B vocab lint per design/ui-vocabulary.md)
#   - dotnet test  (MatchSim + MatchSim.Tests)
# Future Phase-3/6 checks (content-pack schema, save-migration fixtures)
# wire into `fw verify` as they land — no workflow file edit required. The
# commented jobs below are a reference shape for when a check needs to run as
# a parallel job instead of inside the umbrella.

name: Fast PR CI (Tier A)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel in-progress runs for the same branch when a new push arrives —
# saves Actions minutes on rapid iteration.
concurrency:
  group: fast-pr-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Tier A umbrella, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        # Required for `fw verify`'s embedded `dotnet test` step
        # (Phase-3 Week-1 onward — MatchSim + MatchSim.Tests).
        # MatchSim.csproj targets netstandard2.1 (Unity-compat);
        # MatchSim.Tests.csproj targets net10.0. global.json pins the
        # local SDK feature band; CI installs the matching major/minor SDK.
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Python
        # Required for `fw verify`'s banned-terms lint step on every OS.
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fw verify
        # Umbrella runs every Tier-A check currently implemented
        # (verify-docs + banned-terms + dotnet test as of 2026-04-27).
        # New checks wire into scripts/fw verify as Phase-3/6 deliverables land.
        shell: bash
        run: bash ./scripts/fw verify

  # ------------------------------------------------------------------
