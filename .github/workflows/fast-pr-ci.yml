  # Tier-A checks are expected to land inside `scripts/fw verify`
  # (umbrella). Uncomment below ONLY if a specific check needs its own
  # parallel job (e.g., separate failure surface, independent timeout,
  # or heavier setup like dotnet/python install that the umbrella
  # shouldn't carry). As of 2026-04-26, verify-docs + banned-terms +
