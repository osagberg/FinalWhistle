# Direct-Pressing manager archetype.
#
# High-tempo pressing. Players hunt the ball aggressively in the opponent's
# half; build-up is fast and direct.
#
# Authored 2026-04-27 in HOME orientation: own goal at X = -52.5; opponent
# goal at X = +52.5. BehaviorTreeRunner mirrors X for Away usage.
# Formation is a 4-4-2 (RosterSlot 1 = GK; 2-5 = back four; 6-9 = midfield
# four; 10-11 = strikers). Coordinate convention per match-engine.md.

name: direct-pressing
description: |
  High-tempo pressing archetype. Compact 4-4-2 with two strikers leading
  the press. Press radius is generous — players engage the ball as soon as
  it enters the middle third. Build-up speed factor near 1.0 means
  in-possession players run nearly at sprint, prioritizing tempo over
  patience.

formation:
  - { roster_slot: 1,  role: GK,  x: -45, z:   0 }
  - { roster_slot: 2,  role: RB,  x: -25, z:  20 }
  - { roster_slot: 3,  role: RCB, x: -30, z:   8 }
  - { roster_slot: 4,  role: LCB, x: -30, z:  -8 }
  - { roster_slot: 5,  role: LB,  x: -25, z: -20 }
  - { roster_slot: 6,  role: RM,  x:  -5, z:  20 }
  - { roster_slot: 7,  role: RCM, x: -10, z:   5 }
  - { roster_slot: 8,  role: LCM, x: -10, z:  -5 }
  - { roster_slot: 9,  role: LM,  x:  -5, z: -20 }
  - { roster_slot: 10, role: RST, x:  20, z:   5 }
  - { roster_slot: 11, role: LST, x:  20, z:  -5 }

press_radius_metres: 25
buildup_speed_factor: 0.95
